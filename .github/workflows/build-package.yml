name: Build Package

# Controls when the workflow will run
on:
  workflow_dispatch:
  
  push:
    #branches: [ "master", "main", "*" ]
    branches: [ "*" ]
  pull_request:
    #branches: [ "master", "main", "*" ]
    branches: [ "*" ]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # The crypt script rebuilds the GRUB core image on every grub upgrade.
      # A broken script means an unthemed prompt at worst, but it is cheap to
      # catch mistakes before publishing the package.
      - uses: actions/checkout@v4

      - name: Check the hook scripts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck gettext
          shellcheck grub-theme-biglinux/usr/share/libalpm/scripts/*
          for catalog in locale/*.po; do msgfmt -o /dev/null "$catalog"; done

      - name: Send Hooks BigLinux Build Package
        shell: bash
        run: |
          curl -X POST -H "Accept: application/json" -H "Authorization: token ${{ secrets.WEBHOOK_TOKEN }}" --data '{"event_type": "${{ github.repository }}", "client_payload": { "branch": "${{ github.ref_name }}", "url": "https://github.com/${{ github.repository }}", "version": "1.2.3"}}' https://api.github.com/repos/BigLinux-Package-Build/build-package/dispatches
