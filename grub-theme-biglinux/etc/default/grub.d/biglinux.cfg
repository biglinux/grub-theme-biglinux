# BigLinux defaults for GRUB. grub-mkconfig reads /etc/default/grub before
# this file, so a value set there is kept: these lines only fill what is not
# set. Set a variable there, even to an empty value, to override it.

GRUB_THEME=${GRUB_THEME-/boot/grub/themes/biglinux/theme.txt}

# 31_efi_bootnext adds a menu entry for every firmware boot option, this
# system's own entry and the firmware's setup and disk entries included,
# next to the systems os-prober already lists.
GRUB_DISABLE_BOOTNEXT=${GRUB_DISABLE_BOOTNEXT-true}
